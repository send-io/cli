release:
  github:
    owner: send-io # TODO: placeholder
    name: cli # TODO: placeholder
  draft: true
  prerelease: auto
  name_template: "sendio {{ .Version }}"
  footer: |
    Install: `curl -fsSL https://app.send.io/install.sh | sh` (macOS, Linux)
    or `irm https://app.send.io/install.ps1 | iex` (Windows PowerShell).
