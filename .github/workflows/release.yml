# Releases the sendio CLI when a vX.Y.Z tag lands on the public mirror
# (send-io/cli). goreleaser builds and uploads the binaries, archives,
# checksums and deb/rpm packages to the GitHub release; then the npm packages
# (@sendio/cli and one per platform) are published through npm trusted
# publishing (OIDC, with provenance, no token).
# ponytail: the Docker image, Homebrew tap and Scoop bucket are skipped until
# their repos and tokens exist; drop them from --skip then.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=docker,homebrew,scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - run: node scripts/npm-packages.mjs
      - name: Publish the platform packages, then @sendio/cli
        run: |
          for d in dist/npm/cli-*/; do (cd "$d" && npm publish --access public); done
          cd dist/npm/cli && npm publish --access public
