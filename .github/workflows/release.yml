# Releases the sendio CLI when a vX.Y.Z tag lands on the public mirror
# (send-io/cli). goreleaser builds and uploads the binaries, archives,
# checksums and deb/rpm packages to the GitHub release; then the npm packages
# (@sendio/cli and one per platform) are published through npm trusted
# publishing (OIDC, with provenance, no token).
# ponytail: the Docker image, Homebrew tap and Scoop bucket are skipped until
# their repos and tokens exist; drop them from --skip then. The npm steps run
# only when the repository variable NPM_PUBLISH is "true": the first npm
# publish has to happen once by hand, then the package gets this workflow as
# its trusted publisher.

name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run only checks that npm accepts this workflow's sign-in for each
  # package. It builds and publishes nothing. Run it before tagging: a failed
  # release job must not be rerun (goreleaser would run again on a published
  # release), so the npm sign-in has to be known good beforehand.
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=docker,homebrew,scoop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ vars.NPM_PUBLISH == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: node scripts/npm-packages.mjs
      - if: ${{ vars.NPM_PUBLISH == 'true' }}
        name: Publish the platform packages, then @sendio/cli
        run: |
          for d in dist/npm/cli-*/; do (cd "$d" && npm publish --access public); done
          cd dist/npm/cli && npm publish --access public

  npm-signin-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # The same request npm publish makes first. Prints npm's answer per
      # package, never a token (this log is public). npm answers "package not
      # found" for every mismatch, whether the package is missing, has no
      # trusted publisher, or trusts another repository or workflow file.
      - name: Ask npm whether it accepts this workflow for each package
        run: |
          set -eu
          idt=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$idt" | cut -d. -f2 | python3 -c 'import sys,base64,json; s=sys.stdin.read().strip(); c=json.loads(base64.urlsafe_b64decode(s+"="*(-len(s)%4))); print({k:c.get(k) for k in ("repository","repository_visibility","workflow_ref","job_workflow_ref","ref","event_name","environment","runner_environment")})'
          fail=0
          for p in cli cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-arm64 cli-win32-x64; do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $idt" -H 'Content-Type: application/json' --data '' "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@sendio%2f$p")
            if grep -q '"token"' resp.json; then echo "@sendio/$p: HTTP $code, npm accepts the sign-in"
            else echo "@sendio/$p: HTTP $code $(head -c 400 resp.json)"; fail=1; fi
            rm -f resp.json
          done
          exit $fail
